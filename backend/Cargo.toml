[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
tokio = { version = "1.48", features = ["full"] }
russh = { version = "0.63.2", default-features = false, features = ["ring", "rsa"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
